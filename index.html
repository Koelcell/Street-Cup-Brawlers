const R=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0,

const FCH="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,:!?-+/'><()%*=;";
const FGL="ehvhh uhuhu fgggf uhhhu vgugv vgugg fgjhf hhvhh v444v 722ic hisih ggggv hrlhh hpljh ehhhe uhugg ehlid uhuih fge1u v4444 hhhhe hhaa4 hhlla ha4ah ha444 v248v ejlpe 4c44e u1egv u1e1u iiv22 vgu1u eguhe v1244 ehehe ehf1e 00000 00004 00048 04040 44404 eh604 00e00 04e40 1248g 44000 84248 24842 24442 84448 h248h 0a4a0 0e0e0 04048".split(' ');

 const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);

 const s=ac.createBufferSource();s.buffer=AU.noise;const f=ac.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq||2000;
 const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(dest||AU.master);s.start(t);s.stop(t+dur+0.02);}

function swell(att,hold,rel,vol,freq,t0,type){const ac=AU.ac;if(!ac)return;const t=ac.currentTime+Math.max(0,t0||0),dur=att+hold+rel;

function shadeCanvas(c){const g=c.getContext('2d'),w=c.width,h=c.height,id=g.getImageData(0,0,w,h),d=id.data;if(!d||!d.length)return;const o=new Uint8ClampedArray(d);
 const K=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return -1;const i=(y*w+x)*4;return d[i+3]>128?(d[i]<<16|d[i+1]<<8|d[i+2]):-1;};

  if(k<0){const n=[K(x,y+1),K(x-1,y),K(x+1,y),K(x,y-1)].find(v=>v>=0);
   if(n!==undefined){o[i]=(n>>16&255)*0.22;o[i+1]=(n>>8&255)*0.2;o[i+2]=(n&255)*0.24+18;o[i+3]=255;}continue;}
  let r=d[i],gg=d[i+1],b=d[i+2];
  if(K(x,y-1)!==k||K(x-1,y)!==k){r+=(255-r)*0.38;gg+=(255-gg)*0.36;b+=(255-b)*0.3;}
  else if(K(x,y+1)!==k||K(x+1,y)!==k){r*=0.6;gg*=0.6;b=b*0.68+10;}
  else if(K(x,y+2)!==k||K(x+2,y)!==k){r*=0.82;gg*=0.82;b=b*0.86+4;}
  o[i]=r;o[i+1]=gg;o[i+2]=b;o[i+3]=255;}
 id.data.set(o);g.putImageData(id,0,0);}
